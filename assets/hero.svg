<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" role="img" aria-label="Karnik Khanwilkar — GenAI and Full-Stack Developer">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono','Cascadia Code','Consolas',monospace; }
      .disp { font-family: 'Arial Narrow','Helvetica Neue',Arial,sans-serif; font-stretch: condensed; }
    </style>
  </defs>

  <!-- ============ CANVAS ============ -->
  <rect width="900" height="280" fill="#FFFFFF"/>

  <!-- subtle blueprint grid -->
  <g stroke="#0E0E0C" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 70H900 M0 140H900 M0 210H900"/>
    <path d="M112 0V280 M225 0V280 M337 0V280 M450 0V280 M562 0V280 M675 0V280 M787 0V280"/>
  </g>

  <!-- hairlines top & bottom -->
  <rect x="0" y="0" width="900" height="1" fill="#0E0E0C" opacity="0.15"/>
  <rect x="0" y="279" width="900" height="1" fill="#0E0E0C" opacity="0.15"/>

  <!-- index label, portfolio-style -->
  <text x="36" y="42" class="mono" font-size="11" letter-spacing="3" fill="#8A887F">00 — README</text>
  <text x="864" y="42" class="mono" font-size="11" letter-spacing="3" fill="#8A887F" text-anchor="end">EST. GWALIOR → INDORE</text>

  <!-- ============ PIXEL AVATAR (unit = 7px, origin 96,58) ============ -->
  <g transform="translate(96,58)">
    <animateTransform attributeName="transform" type="translate" values="96,58; 96,52; 96,58" dur="3.2s" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" repeatCount="indefinite"/>

    <!-- hair -->
    <g fill="#241511">
      <rect x="49" y="0"  width="56" height="7"/>
      <rect x="35" y="7"  width="84" height="7"/>
      <rect x="28" y="14" width="98" height="7"/>
      <rect x="21" y="21" width="112" height="7"/>
      <rect x="21" y="28" width="28" height="7"/>
      <rect x="105" y="28" width="28" height="7"/>
      <rect x="21" y="35" width="14" height="7"/>
      <rect x="119" y="35" width="14" height="7"/>
    </g>
    <!-- hair sheen -->
    <rect x="42" y="7" width="28" height="7" fill="#3A241C"/>

    <!-- ears -->
    <rect x="7"   y="42" width="14" height="21" fill="#C77B46"/>
    <rect x="133" y="42" width="14" height="21" fill="#C77B46"/>
    <rect x="10"  y="49" width="7"  height="7"  fill="#A85F33"/>
    <rect x="137" y="49" width="7"  height="7"  fill="#A85F33"/>

    <!-- face -->
    <rect x="49" y="28" width="56" height="7"  fill="#C77B46"/>
    <rect x="35" y="35" width="84" height="7"  fill="#C77B46"/>
    <rect x="21" y="42" width="112" height="42" fill="#C77B46"/>
    <rect x="28" y="84" width="98" height="7"  fill="#C77B46"/>
    <rect x="42" y="91" width="70" height="7"  fill="#C77B46"/>

    <!-- eyes (with blink) -->
    <g fill="#0E0E0C">
      <rect x="42" y="49" width="14" height="14">
        <animate attributeName="height" values="14;14;2;14;14" keyTimes="0;0.92;0.95;0.98;1" dur="4.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="49;49;58;49;49" keyTimes="0;0.92;0.95;0.98;1" dur="4.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="98" y="49" width="14" height="14">
        <animate attributeName="height" values="14;14;2;14;14" keyTimes="0;0.92;0.95;0.98;1" dur="4.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="49;49;58;49;49" keyTimes="0;0.92;0.95;0.98;1" dur="4.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- open smile + tongue -->
    <rect x="56" y="70" width="42" height="14" fill="#160B08"/>
    <rect x="63" y="77" width="28" height="7"  fill="#C33C28"/>

    <!-- neck -->
    <rect x="63" y="98" width="28" height="7" fill="#B06A39"/>

    <!-- t-shirt -->
    <g fill="#1B1D22">
      <rect x="35" y="105" width="84"  height="7"/>
      <rect x="21" y="112" width="112" height="35"/>
      <rect x="14" y="119" width="7"   height="21"/>
      <rect x="133" y="119" width="7"  height="21"/>
    </g>
    <!-- collar shadow -->
    <rect x="56" y="105" width="42" height="7" fill="#101216"/>

    <!-- arms -->
    <rect x="0"   y="126" width="14" height="21" fill="#C77B46"/>
    <rect x="140" y="126" width="14" height="21" fill="#C77B46"/>
  </g>

  <!-- baseline under avatar, lime tick -->
  <rect x="96" y="216" width="154" height="1" fill="#0E0E0C" opacity="0.15"/>
  <rect x="96" y="215" width="34" height="3" fill="#C8F04B">
    <animate attributeName="x" values="96;216;96" dur="5s" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" repeatCount="indefinite"/>
  </rect>
  <text x="96" y="238" class="mono" font-size="10" letter-spacing="2" fill="#8A887F">PLAYER.SVG — HANDMADE, 7PX GRID</text>

  <!-- ============ TYPE BLOCK ============ -->
  <g transform="translate(330,0)">
    <!-- name -->
    <text x="0" y="118" class="disp" font-size="52" font-weight="600" letter-spacing="1" fill="#0E0E0C">KARNIK</text>
    <text x="0" y="168" class="disp" font-size="52" font-weight="600" letter-spacing="1" fill="#0E0E0C">KHANWILKAR</text>

    <!-- lime underline draws in -->
    <rect x="0" y="182" width="0" height="3" fill="#C8F04B">
      <animate attributeName="width" values="0;318;318;318" keyTimes="0;0.25;0.9;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;1;0" keyTimes="0;0.25;0.9;1" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- role -->
    <text x="0" y="78" class="mono" font-size="12" letter-spacing="4" fill="#6E8A0E">GENAI &amp; FULL-STACK DEVELOPER</text>

    <!-- status line with blinking cursor -->
    <text x="0" y="214" class="mono" font-size="12" letter-spacing="1" fill="#55534C">building GenAI pipelines &amp; RAG systems @ GiryoTech</text>
    <rect x="418" y="204" width="7" height="12" fill="#C8F04B">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>

    <!-- availability -->
    <circle cx="5" cy="240" r="4" fill="#C8F04B">
      <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="18" y="244" class="mono" font-size="11" letter-spacing="2" fill="#8A887F">OPEN TO COLLABORATION — GENAI / LLM</text>
  </g>
</svg>
